<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to KharchKit on Google Play...</title>
  <meta name="description" content="Download KharchKit: Expense Tracker on Google Play Store. Fast, private personal budgeting and expense tracking.">
  <meta name="theme-color" content="#14131B">
  
  <!-- Immediate Refresh Redirect -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.kharchkit.app">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        const t = localStorage.getItem('rg_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>

  <style>
    :root {
      --bg-main: #14131B;
      --bg-surface: #201F2A;
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #B5A7FF;
      --primary-glow: rgba(181, 167, 255, 0.35);
      --accent-green: #34D399;
      --text-main: #F5F3FA;
      --text-secondary: #B7B4C5;
      --text-muted: #7E7B8D;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-lg: 20px;
    }

    [data-theme="light"] {
      --bg-main: #F8F7FC;
      --bg-surface: #FFFFFF;
      --border-color: rgba(37, 35, 51, 0.1);
      --primary: #6554C0;
      --primary-glow: rgba(101, 84, 192, 0.25);
      --accent-green: #0D8A58;
      --text-main: #252333;
      --text-secondary: #686779;
      --text-muted: #757388;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      line-height: 1.6;
    }

    .redirect-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 10px 25px var(--primary-glow);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .btn-playstore {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #000000;
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 14px 28px;
      border-radius: 9999px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .btn-playstore:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
    }

    .btn-playstore svg {
      width: 22px;
      height: 22px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(181, 167, 255, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-link {
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .footer-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <img src="assets/icon.png" alt="KharchKit Logo" class="app-icon">
    <div class="spinner"></div>
    <h1>Taking You to Google Play...</h1>
    <p>Opening KharchKit — 1-Second Private Expense Tracker on the Google Play Store.</p>
    
    <a href="https://play.google.com/store/apps/details?id=com.kharchkit.app" class="btn-playstore">
      <svg viewBox="0 0 512 512">
        <path fill="#00e5ff" d="M48.7 13.1c-6.8 7.3-10.7 18.2-10.7 31.9v422c0 13.7 3.9 24.6 10.7 31.9l2.4 2.2L282.8 269.4v-5.8L51.1 10.9l-2.4 2.2z" />
        <path fill="#ff3a44" d="M358.5 345.1l-75.7-75.7v-5.8l75.7-75.7 1.8 1 89.6 51c25.6 14.5 25.6 38.3 0 52.9l-89.6 51-1.8 1.3z" />
        <path fill="#00e676" d="M282.8 263.6L51.1 495.3c8.5 9 22.4 10.1 38.1 1.2l269.3-152.9-75.7-76z" />
        <path fill="#ffd500" d="M282.8 248.4l75.7-76L89.2 19.5c-15.7-8.9-29.6-7.8-38.1 1.2l231.7 227.7z" />
      </svg>
      <span>Download on Google Play</span>
    </a>

    <a href="index.html" class="footer-link">← Return to KharchKit Website</a>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "https://play.google.com/store/apps/details?id=com.kharchkit.app";
    }, 400);
  </script>
</body>
</html>
