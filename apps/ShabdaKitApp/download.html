<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to ShabdaKit on Google Play...</title>
  <meta name="description" content="Download ShabdaKit: Languages & Fluency on Google Play Store. Learn languages directly from your mother tongue with private speaking and daily lessons.">
  <meta name="theme-color" content="#12131A">
  
  <!-- Immediate Refresh Redirect -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.shabdakit.app">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        const theme = localStorage.getItem('rg_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}
    })();
  </script>

  <style>
    :root {
      --bg-main: #12131A;
      --bg-surface: #1A1B24;
      --primary: #7986CB;
      --accent-saffron: #FFB74D;
      --text-main: #FDFBF7;
      --text-muted: #7E8294;
    }
    [data-theme="light"] {
      --bg-main: #FDFBF7;
      --bg-surface: #FFFFFF;
      --primary: #1A237E;
      --accent-saffron: #E65100;
      --text-main: #1E1E24;
      --text-muted: #5C5F68;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(26, 35, 126, 0.35);
      object-fit: cover;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(121, 134, 203, 0.2);
      border-top-color: var(--accent-saffron);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 10px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-playstore {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1A237E, #283593);
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 24px rgba(26, 35, 126, 0.4);
      width: 100%;
    }
    .btn-playstore:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(26, 35, 126, 0.5);
    }
    .btn-playstore svg {
      width: 20px;
      height: 20px;
    }
    .alt-links {
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .alt-links a {
      color: var(--primary);
      text-decoration: none;
    }
    .alt-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="assets/shabdakit-logo.png" alt="ShabdaKit Icon" class="app-icon">
    <div>
      <h1>Opening Google Play Store</h1>
      <p>Redirecting you to download <strong>ShabdaKit – Learn Languages</strong> for Android...</p>
    </div>
    
    <div class="loader" aria-label="Loading"></div>

    <a href="https://play.google.com/store/apps/details?id=com.shabdakit.app" class="btn-playstore" id="manualBtn">
      <svg viewBox="0 0 512 512">
        <path fill="#00e5ff" d="M48.7 13.1c-6.8 7.3-10.7 18.2-10.7 31.9v422c0 13.7 3.9 24.6 10.7 31.9l2.4 2.2L282.8 269.4v-5.8L51.1 10.9l-2.4 2.2z" />
        <path fill="#ff3a44" d="M358.5 345.1l-75.7-75.7v-5.8l75.7-75.7 1.8 1 89.6 51c25.6 14.5 25.6 38.3 0 52.9l-89.6 51-1.8 1.3z" />
        <path fill="#00e676" d="M282.8 263.6L51.1 495.3c8.5 9 22.4 10.1 38.1 1.2l269.3-152.9-75.7-76z" />
        <path fill="#ffd500" d="M282.8 248.4l75.7-76L89.2 19.5c-15.7-8.9-29.6-7.8-38.1 1.2l231.7 227.7z" />
      </svg>
      <span>Open in Google Play</span>
    </a>

    <div class="alt-links">
      <a href="index.html">← Back to ShabdaKit Overview</a>
    </div>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "https://play.google.com/store/apps/details?id=com.shabdakit.app";
    }, 400);
  </script>
</body>
</html>
