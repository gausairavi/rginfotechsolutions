<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to The Grand Athlete on Google Play...</title>
  <meta name="description" content="Download The Grand Athlete on Google Play Store. Smart workout, nutrition & daily athlete companion.">
  <meta name="theme-color" content="#08090C">
  
  <!-- Immediate Refresh Redirect -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.thegrandathlete.app">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icon.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        const t = localStorage.getItem('rg_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>

  <style>
    :root {
      --bg-main: #08090C;
      --bg-surface: #10121A;
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #FF6E40;
      --primary-glow: rgba(255, 110, 64, 0.35);
      --accent-green: #00E676;
      --text-main: #FFFFFF;
      --text-secondary: #9E9EB8;
      --text-muted: #64647A;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-lg: 20px;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --border-color: rgba(15, 23, 42, 0.08);
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
    }

    [data-theme="light"] .redirect-card {
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    .theme-toggle-corner {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .theme-toggle-corner:hover {
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .theme-icon-sun { display: flex; color: #f59e0b; }
    .theme-icon-moon { display: none; color: #6366f1; }
    [data-theme="light"] .theme-icon-sun { display: none; }
    [data-theme="light"] .theme-icon-moon { display: flex; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Glow */
    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 110, 64, 0.18) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .redirect-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 30px var(--primary-glow);
      border: 2px solid rgba(255, 110, 64, 0.4);
    }

    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 110, 64, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .playstore-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      background: linear-gradient(135deg, #FF6E40 0%, #FF8A65 100%);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 8px 25px var(--primary-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    .playstore-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(255, 110, 64, 0.5);
    }

    .fallback-note {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .redirect-card {
        padding: 2rem 1.25rem;
        border-radius: 20px;
        gap: 1.25rem;
      }
      .app-icon {
        width: 80px;
        height: 80px;
        border-radius: 18px;
      }
      .redirect-title {
        font-size: 1.5rem;
      }
      .redirect-desc {
        font-size: 0.9rem;
      }
      .playstore-btn {
        padding: 0.85rem 1.25rem;
        font-size: 0.95rem;
      }
      .footer-links {
        flex-direction: column;
        gap: 0.75rem;
      }
    }
  </style>

  <script>
    // Direct instantaneous redirection to Google Play Store
    (function directPlayStoreRedirect() {
      const playStorePackage = "com.thegrandathlete.app";
      const webUrl = "https://play.google.com/store/apps/details?id=" + playStorePackage;
      const marketUrl = "market://details?id=" + playStorePackage;
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Attempt native Play Store application intent on Android devices
        window.location.href = marketUrl;
        // Fallback to Web Play Store URL after brief interval if native market intent doesn't resolve
        setTimeout(function() {
          window.location.replace(webUrl);
        }, 500);
      } else {
        // Direct browser navigation to Google Play Store
        window.location.replace(webUrl);
      }
    })();
  </script>
</head>
<body>

  <button class="theme-toggle-corner" id="themeToggleBtn" aria-label="Toggle Light and Dark Mode" title="Toggle Light/Dark Theme">
    <span class="theme-icon-sun">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </span>
    <span class="theme-icon-moon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </span>
  </button>

  <div class="redirect-card">
    <img src="assets/icon.png" alt="The Grand Athlete App Icon" class="app-icon" onerror="this.src='assets/logo.png'">
    
    <div class="spinner-ring"></div>

    <div>
      <h1>Redirecting to Google Play...</h1>
      <p>Taking you directly to <strong>The Grand Athlete</strong> on the Google Play Store.</p>
    </div>

    <!-- Manual Action Button in case browser blocks auto-redirect -->
    <a href="https://play.google.com/store/apps/details?id=com.thegrandathlete.app" class="playstore-btn" id="playstore-manual-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.609 1.814L13.792 12 3.61 22.186a2.41 2.41 0 0 1-.61-1.686V3.5a2.41 2.41 0 0 1 .609-1.686zM15.207 13.414l2.658 2.658-11.8 6.777 9.142-9.435zm0-2.828L6.065 1.151l11.8 6.777-2.658 2.658zm1.414 1.414l3.443-1.975a1.412 1.412 0 0 0 0-2.45L16.621 12z"/>
      </svg>
      <span>Open in Google Play Store</span>
    </a>

    <p class="fallback-note">If you are not redirected automatically, tap the button above.</p>

    <div class="footer-links">
      <a href="index.html">&larr; App Overview</a>
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
  </div>

  <script>
    document.getElementById('themeToggleBtn')?.addEventListener('click', function() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('rg_theme', next); } catch(e) {}
    });
  </script>

</body>
</html>
